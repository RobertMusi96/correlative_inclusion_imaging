[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cii"
version = "0.3.0"
description = "Correlative inclusion imaging: Keyence VHX light microscopy and SEM/EDS"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "tifffile",
    "imagecodecs",   # LZW-compressed TIFFs (AZtec exports)
    "pillow",
    "pandas",
    "openpyxl",      # reading the AZtec Excel exports (pandas.read_excel)
    "matplotlib",
    "scikit-learn",  # stratified group k-fold for the dataset split
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
